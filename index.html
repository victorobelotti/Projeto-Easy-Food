<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>EasyFood</title>

  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-soft: #f8f8f8;
      --text: #191919;
      --muted: #767676;
      --border: #ececec;
      --primary: #171717;
      --danger: #d94b4b;
      --success: #2e7d32;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app-shell {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 40px));
      min-height: 620px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 8px solid var(--primary);
      border-radius: 40px;
      box-shadow: var(--shadow);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px 8px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .app-header {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 8px 18px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .icon-button:hover {
      background: var(--surface-soft);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 21px;
      font-weight: 800;
      font-style: italic;
    }

    .brand-icon {
      font-style: normal;
    }

    .cart-button {
      position: relative;
      justify-self: end;
    }

    .cart-badge {
      position: absolute;
      top: 1px;
      right: 1px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
    }

    .home-view {
      min-height: 0;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .search-area {
      padding: 16px 18px 12px;
      flex-shrink: 0;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .search-bar:focus-within {
      border-color: #c9c9c9;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    .search-bar input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .search-bar input::placeholder {
      color: #9b9b9b;
    }

    .clear-search {
      display: none;
      width: 24px;
      height: 24px;
      cursor: pointer;
      border-radius: 50%;
      background: #e9e9e9;
      color: #666;
      font-size: 12px;
    }

    .clear-search.visible {
      display: inline-grid;
      place-items: center;
    }

    .categories {
      display: flex;
      gap: 8px;
      padding: 0 18px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      padding: 8px 14px;
      border: 1px solid #e3e3e3;
      border-radius: 999px;
      background: #fff;
      color: #4a4a4a;
      white-space: nowrap;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .category-chip:hover {
      background: #f2f2f2;
    }

    .category-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 18px 12px;
      flex-shrink: 0;
    }

    .section-header h2 {
      font-size: 18px;
    }

    .result-count {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .sort-select {
      max-width: 112px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      background: var(--surface-soft);
      color: #555;
      font-size: 11px;
      cursor: pointer;
    }

    .restaurant-list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 0 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .restaurant-card {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      animation: fadeIn 0.28s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .restaurant-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .restaurant-image {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #f7f7f7, #ededed);
      font-size: 29px;
    }

    .restaurant-info {
      min-width: 0;
    }

    .restaurant-info h3 {
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .restaurant-meta {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 800;
    }

    .restaurant-side {
      height: 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
    }

    .favorite-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      color: #bdbdbd;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s ease;
    }

    .favorite-button:hover,
    .favorite-button.active {
      color: var(--danger);
      background: #fff2f2;
    }

    .delivery-info {
      color: var(--muted);
      text-align: right;
      font-size: 10px;
      line-height: 1.35;
    }

    .delivery-price {
      color: #333;
      font-weight: 800;
    }

    .load-more-btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      color: #333;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .load-more-btn:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .load-more-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .loading,
    .empty-state,
    .error-state {
      padding: 52px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .state-icon {
      margin-bottom: 10px;
      font-size: 34px;
    }

    .spinner,
    .mini-spinner {
      display: inline-block;
      border-style: solid;
      border-color: #e0e0e0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin-bottom: 10px;
      border-width: 3px;
    }

    .mini-spinner {
      width: 13px;
      height: 13px;
      margin-right: 6px;
      border-width: 2px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      color: var(--danger);
    }

    .error-state small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
    }

    .add-restaurant-section {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .add-restaurant-section.active {
      display: block;
    }

    .view-title {
      margin-bottom: 5px;
      font-size: 20px;
    }

    .view-subtitle {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: 0;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 13px;
      transition: 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #bfbfbf;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.035);
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .form-message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 9px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .form-message.success {
      display: block;
      background: #edf8ef;
      color: var(--success);
    }

    .form-message.error {
      display: block;
      background: #fff0ef;
      color: #c62828;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 9px 5px 11px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      flex-shrink: 0;
    }

    .nav-item {
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border-radius: 10px;
      color: #aaa;
      cursor: pointer;
      user-select: none;
      font-size: 9px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .nav-item:hover {
      background: var(--surface-soft);
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 19px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: #fff;
      }

      .app-shell {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>

    <header class="app-header">
      <button class="icon-button" type="button" aria-label="Abrir menu">☰</button>

      <div class="brand" aria-label="EasyFood">
        <span class="brand-icon">🍴</span>
        <span>EasyFood</span>
      </div>

      <button class="icon-button cart-button" type="button" aria-label="Carrinho">
        🛒
        <span class="cart-badge">2</span>
      </button>
    </header>

    <section class="home-view" id="home-view">
      <div class="search-area">
        <div class="search-bar">
          <span aria-hidden="true">🔍</span>
          <input
            type="search"
            id="search-input"
            placeholder="Buscar restaurantes"
            autocomplete="off"
            aria-label="Buscar restaurantes"
          >
          <button class="clear-search" id="clear-search" type="button" aria-label="Limpar busca">✕</button>
        </div>
      </div>

      <div class="categories" id="categories" aria-label="Categorias de restaurantes">
        <button class="category-chip active" type="button" data-category="Todos">🍽️ Todos</button>
        <button class="category-chip" type="button" data-category="Burger">🍔 Burger</button>
        <button class="category-chip" type="button" data-category="Pizza">🍕 Pizza</button>
        <button class="category-chip" type="button" data-category="Sushi">🍣 Sushi</button>
        <button class="category-chip" type="button" data-category="Saudável">🥗 Saudável</button>
      </div>

      <div class="section-header">
        <div>
          <h2>Restaurantes</h2>
          <span class="result-count" id="result-count">Carregando...</span>
        </div>

        <select class="sort-select" id="sort-select" aria-label="Ordenar restaurantes">
          <option value="default">Ordenar</option>
          <option value="rating-desc">Melhor avaliação</option>
          <option value="name-asc">Nome A-Z</option>
        </select>
      </div>

      <div class="restaurant-list" id="restaurant-list" aria-live="polite">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando restaurantes...</p>
        </div>
      </div>
    </section>

    <section class="add-restaurant-section" id="add-restaurant-section">
      <h1 class="view-title">Cadastrar restaurante</h1>
      <p class="view-subtitle">Informe os dados abaixo para adicionar um novo restaurante ao EasyFood.</p>

      <form id="add-restaurant-form">
        <div class="form-group">
          <label for="restaurant-name">Nome do restaurante</label>
          <input
            type="text"
            id="restaurant-name"
            placeholder="Ex.: Taco Loco"
            maxlength="80"
            required
          >
        </div>

        <div class="form-group">
          <label for="restaurant-category">Categoria</label>
          <select id="restaurant-category" required>
            <option value="">Selecione uma categoria</option>
            <option value="Burger">🍔 Burger</option>
            <option value="Pizza">🍕 Pizza</option>
            <option value="Sushi">🍣 Sushi</option>
            <option value="Saudável">🥗 Saudável</option>
            <option value="Mexicana">🌮 Mexicana</option>
            <option value="Brasileira">🍛 Brasileira</option>
            <option value="Japonesa">🍱 Japonesa</option>
            <option value="Italiana">🍝 Italiana</option>
          </select>
        </div>

        <div class="form-group">
          <label for="restaurant-rating">Avaliação</label>
          <input
            type="number"
            id="restaurant-rating"
            placeholder="Ex.: 4.3"
            min="0"
            max="5"
            step="0.1"
            required
          >
        </div>

        <button class="submit-btn" id="submit-btn" type="submit">Cadastrar Restaurante</button>
      </form>

      <div class="form-message" id="form-message" role="status"></div>
    </section>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <div class="nav-item active" data-view="home" tabindex="0" role="button">
        <span class="nav-icon">🏠</span>
        <span>Início</span>
      </div>
      <div class="nav-item" data-view="search" tabindex="0" role="button">
        <span class="nav-icon">🔍</span>
        <span>Buscar</span>
      </div>
      <div class="nav-item" data-view="add" tabindex="0" role="button">
        <span class="nav-icon">➕</span>
        <span>Cadastrar</span>
      </div>
      <div class="nav-item" data-view="favorites" tabindex="0" role="button">
        <span class="nav-icon">❤️</span>
        <span>Favoritos</span>
      </div>
      <div class="nav-item" data-view="profile" tabindex="0" role="button">
        <span class="nav-icon">👤</span>
        <span>Perfil</span>
      </div>
    </nav>
  </main>

  <script>
    const API_URL = "http://localhost:3000/restaurants";
    const PAGE_SIZE = 3;

    let allRestaurants = [];
    let filteredRestaurants = [];
    let selectedCategory = "Todos";
    let searchTerm = "";
    let sortMode = "default";
    let currentPage = 0;

    const deliveryPrices = {};
    const favorites = new Set();

    const categoryEmoji = {
      Pizza: "🍕",
      Burger: "🍔",
      Sushi: "🍣",
      Saudável: "🥗",
      Mexicana: "🌮",
      Brasileira: "🍛",
      Japonesa: "🍱",
      Italiana: "🍝"
    };

    const restaurantList = document.getElementById("restaurant-list");
    const resultCount = document.getElementById("result-count");
    const searchInput = document.getElementById("search-input");
    const clearSearchButton = document.getElementById("clear-search");
    const sortSelect = document.getElementById("sort-select");
    const addForm = document.getElementById("add-restaurant-form");
    const formMessage = document.getElementById("form-message");

    function getDeliveryPrice(id) {
      if (!deliveryPrices[id]) {
        deliveryPrices[id] = (Math.random() * 5 + 3).toFixed(2).replace(".", ",");
      }
      return deliveryPrices[id];
    }

    function showLoading() {
      restaurantList.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando restaurantes...</p>
        </div>
      `;
    }

    function showError() {
      resultCount.textContent = "Não foi possível carregar a lista";
      restaurantList.innerHTML = `
        <div class="error-state">
          <div class="state-icon">⚠️</div>
          <p><strong>Servidor offline</strong></p>
          <small>Inicie o servidor com <code>node server.js</code> e tente novamente.</small>
        </div>
      `;
    }

    async function fetchRestaurants() {
      showLoading();

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }

        const data = await response.json();
        allRestaurants = Array.isArray(data) ? data : [];
        filterAndRender();
      } catch (error) {
        console.error("Erro ao buscar restaurantes:", error);
        showError();
      }
    }

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function filterAndRender() {
      const normalizedSearch = normalizeText(searchTerm);

      filteredRestaurants = allRestaurants.filter((restaurant) => {
        const matchesCategory =
          selectedCategory === "Todos" || restaurant.category === selectedCategory;

        const matchesSearch =
          !normalizedSearch ||
          normalizeText(restaurant.name).includes(normalizedSearch) ||
          normalizeText(restaurant.category).includes(normalizedSearch);

        return matchesCategory && matchesSearch;
      });

      if (sortMode === "rating-desc") {
        filteredRestaurants.sort((a, b) => Number(b.rating || 0) - Number(a.rating || 0));
      } else if (sortMode === "name-asc") {
        filteredRestaurants.sort((a, b) =>
          String(a.name || "").localeCompare(String(b.name || ""), "pt-BR")
        );
      }

      currentPage = 0;
      renderPage();
    }

    function renderPage() {
      const end = (currentPage + 1) * PAGE_SIZE;
      const visibleRestaurants = filteredRestaurants.slice(0, end);
      const hasMore = end < filteredRestaurants.length;

      resultCount.textContent = `${filteredRestaurants.length} restaurante${filteredRestaurants.length === 1 ? "" : "s"} encontrado${filteredRestaurants.length === 1 ? "" : "s"}`;

      if (visibleRestaurants.length === 0) {
        restaurantList.innerHTML = `
          <div class="empty-state">
            <div class="state-icon">🔎</div>
            <p><strong>Nenhum restaurante encontrado</strong></p>
            <p style="margin-top:6px;">Tente mudar a busca ou a categoria selecionada.</p>
          </div>
        `;
        return;
      }

      let html = visibleRestaurants.map((restaurant, index) => {
        const isFavorite = favorites.has(String(restaurant.id));
        const restaurantEmoji = categoryEmoji[restaurant.category] || "🏪";
        const rating = Number(restaurant.rating || 0).toFixed(1);

        return `
          <article class="restaurant-card" style="animation-delay:${index * 0.04}s">
            <div class="restaurant-image" aria-hidden="true">${restaurantEmoji}</div>

            <div class="restaurant-info">
              <h3 title="${restaurant.name}">${restaurant.name}</h3>
              <div class="restaurant-meta">${restaurant.category || "Restaurante"} • 20-30 min</div>
              <div class="rating">★ ${rating}</div>
            </div>

            <div class="restaurant-side">
              <button
                class="favorite-button ${isFavorite ? "active" : ""}"
                type="button"
                data-favorite-id="${restaurant.id}"
                aria-label="${isFavorite ? "Remover dos favoritos" : "Adicionar aos favoritos"}"
                title="Favoritar"
              >${isFavorite ? "♥" : "♡"}</button>

              <div class="delivery-info">
                Entrega<br>
                <span class="delivery-price">R$ ${getDeliveryPrice(restaurant.id)}</span>
              </div>
            </div>
          </article>
        `;
      }).join("");

      if (hasMore) {
        const remaining = filteredRestaurants.length - end;
        html += `
          <button class="load-more-btn" id="load-more-btn" type="button">
            Carregar mais (${remaining})
          </button>
        `;
      }

      restaurantList.innerHTML = html;

      document.querySelectorAll("[data-favorite-id]").forEach((button) => {
        button.addEventListener("click", () => toggleFavorite(button.dataset.favoriteId));
      });

      const loadMoreButton = document.getElementById("load-more-btn");
      if (loadMoreButton) {
        loadMoreButton.addEventListener("click", loadMore);
      }
    }

    function loadMore() {
      const button = document.getElementById("load-more-btn");

      if (button) {
        button.disabled = true;
        button.innerHTML = '<span class="mini-spinner"></span>Carregando...';
      }

      setTimeout(() => {
        currentPage += 1;
        renderPage();
        restaurantList.scrollTo({ top: restaurantList.scrollHeight, behavior: "smooth" });
      }, 250);
    }

    function toggleFavorite(id) {
      const key = String(id);

      if (favorites.has(key)) {
        favorites.delete(key);
      } else {
        favorites.add(key);
      }

      renderPage();
    }

    document.querySelectorAll(".category-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".category-chip").forEach((item) => item.classList.remove("active"));
        chip.classList.add("active");
        selectedCategory = chip.dataset.category;
        filterAndRender();
      });
    });

    searchInput.addEventListener("input", (event) => {
      searchTerm = event.target.value.trim();
      clearSearchButton.classList.toggle("visible", Boolean(searchTerm));
      filterAndRender();
    });

    clearSearchButton.addEventListener("click", () => {
      searchInput.value = "";
      searchTerm = "";
      clearSearchButton.classList.remove("visible");
      searchInput.focus();
      filterAndRender();
    });

    sortSelect.addEventListener("change", (event) => {
      sortMode = event.target.value;
      filterAndRender();
    });

    function switchView(view) {
      const homeView = document.getElementById("home-view");
      const addSection = document.getElementById("add-restaurant-section");
      const navItems = document.querySelectorAll(".nav-item");

      if (view === "add") {
        homeView.style.display = "none";
        addSection.classList.add("active");
      } else {
        homeView.style.display = "flex";
        addSection.classList.remove("active");

        if (view === "search") {
          setTimeout(() => searchInput.focus(), 0);
          view = "home";
        }
      }

      navItems.forEach((item) => {
        item.classList.toggle("active", item.dataset.view === view);
      });
    }

    document.querySelectorAll(".nav-item").forEach((item) => {
      const activate = () => {
        const view = item.dataset.view;

        if (view === "favorites" || view === "profile") {
          switchView("home");
          return;
        }

        switchView(view);
      };

      item.addEventListener("click", activate);
      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });
    });

    addForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("restaurant-name").value.trim();
      const category = document.getElementById("restaurant-category").value;
      const rating = Number(document.getElementById("restaurant-rating").value);

      if (!name || !category || Number.isNaN(rating) || rating < 0 || rating > 5) {
        showFormMessage("Preencha todos os campos corretamente.", "error");
        return;
      }

      const submitButton = document.getElementById("submit-btn");
      submitButton.disabled = true;
      submitButton.textContent = "Cadastrando...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, category, rating })
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }

        const newRestaurant = await response.json();
        showFormMessage(`✅ "${newRestaurant.name}" cadastrado com sucesso!`, "success");
        addForm.reset();
        allRestaurants.push(newRestaurant);

        setTimeout(() => {
          switchView("home");
          filterAndRender();
        }, 800);
      } catch (error) {
        console.error("Erro ao cadastrar restaurante:", error);
        showFormMessage("❌ Não foi possível cadastrar. Verifique se o servidor está rodando.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar Restaurante";
      }
    });

    function showFormMessage(message, type) {
      formMessage.textContent = message;
      formMessage.className = `form-message ${type}`;

      setTimeout(() => {
        formMessage.className = "form-message";
      }, 4000);
    }

    fetchRestaurants();
  </script>
</body>
</html>
